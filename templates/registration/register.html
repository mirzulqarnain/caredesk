{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="narrow">
  <div class="form-card">
    <h1>Create a patient account</h1>
    <form method="post">
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="form-actions"><button class="btn" type="submit">Create account</button></div>
    </form>
    <p class="muted" style="margin-top:20px">Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
  </div>
</div>
{% endblock %}
