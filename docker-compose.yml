# PART I: run on EC2 with:  docker compose up -d
# Replace YOUR_DOCKERHUB_USER with your Docker Hub username (must match the pushed image).
# Port mappings are HOST:CONTAINER.
services:
  db:
    image: postgres:16-alpine
    container_name: caredesk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: caredesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChangeMe123
    volumes:
      - caredesk_pgdata:/var/lib/postgresql/data     # persistent database volume
    ports:
      - "5433:5432"                                  # host 5433 -> container 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caredesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: zulmir/caredesk:latest
    container_name: caredesk_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: change-me-to-a-long-random-string
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: caredesk
      DB_USER: postgres
      DB_PASSWORD: ChangeMe123
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ChangeMeAdmin1
      SEED_DEMO: "True"
    volumes:
      - caredesk_media:/app/media
    ports:
      - "80:8000"                                    # host 80 -> container 8000

volumes:
  caredesk_pgdata:
  caredesk_media:
